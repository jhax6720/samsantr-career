<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>삼산여객주 채용 홈페이지</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Noto Sans KR"', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #f1f3f7;
            margin: 0;
            padding: 0;
        }

        .hero-banner-container {
            position: relative;
            background: url('background.png') no-repeat center center;
            background-size: cover;
            min-height: 850px;
            width: 100%;
        }

        .exact-job-card {
            background-color: #ffffff;
            border-radius: 0px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            height: 210px;
            padding: 24px 22px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .exact-job-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }

        .hamburger-btn {
            background-color: #25408f;
            width: 64px;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body class="flex flex-col min-h-screen">

    <!-- 상단 헤더 -->
    <header class="bg-white border-b border-gray-200 h-20 sticky top-0 z-50">
        <div class="max-w-[1400px] mx-auto h-full flex items-center justify-between px-4 lg:px-8">
            
            <!-- 로고 -->
            <a href="#" onclick="switchTab('home')" class="flex items-center">
                <img src="Logo.png" alt="삼산여객주 채용" class="h-10 sm:h-12 w-auto object-contain" onerror="this.onerror=null; this.src='https://via.placeholder.com/260x50?text=SAMSAN+LOGO';">
            </a>

            <!-- 메뉴 우측 레이아웃 -->
            <div class="flex items-center space-x-8 sm:space-x-12">
                <nav class="hidden md:flex items-center space-x-10 text-xl font-bold text-gray-800 tracking-tight">
                    <button onclick="switchTab('my')" class="hover:text-blue-700 transition">나의채용</button>
                    <button onclick="switchTab('inquiry')" class="hover:text-blue-700 transition">채용문의</button>
                    <button onclick="switchTab('jobs')" class="hover:text-blue-700 transition">채용공고</button>
                    <button onclick="switchTab('notice')" class="hover:text-blue-700 transition">공지사항</button>
                </nav>

                <button onclick="toggleMobileNav()" class="hamburger-btn text-white text-2xl hover:bg-blue-900 transition">
                    <i class="fas fa-bars"></i>
                </button>
            </div>
        </div>

        <!-- 모바일 메뉴 -->
        <div id="mobile-nav" class="hidden bg-white w-full border-b border-gray-300 shadow-xl py-4 px-6 md:hidden">
            <div class="flex flex-col space-y-3 font-bold text-gray-800 text-lg">
                <button onclick="switchTab('home'); toggleMobileNav();" class="text-left py-2 border-b">홈</button>
                <button onclick="switchTab('my'); toggleMobileNav();" class="text-left py-2 border-b">나의채용</button>
                <button onclick="switchTab('inquiry'); toggleMobileNav();" class="text-left py-2 border-b">채용문의</button>
                <button onclick="switchTab('jobs'); toggleMobileNav();" class="text-left py-2 border-b">채용공고</button>
                <button onclick="switchTab('notice'); toggleMobileNav();" class="text-left py-2 border-b">공지사항</button>
            </div>
        </div>
    </header>

    <!-- 메인 영역 -->
    <main class="flex-grow">

        <!-- 1. 메인 홈 화면 -->
        <div id="view-home" class="view-section">
            <section class="hero-banner-container px-4 sm:px-8 lg:px-12 py-6">
                <div class="max-w-[1360px] mx-auto relative">

                    <!-- 로그인 / 회원가입 상태 바 -->
                    <div class="flex justify-end mb-8">
                        <div id="auth-status-container" class="bg-white/95 backdrop-blur border border-blue-600 rounded-full px-6 py-1.5 shadow-md flex items-center space-x-3 text-sm font-bold text-gray-900">
                            <button onclick="openModal('loginModal')" class="hover:text-blue-700 transition">로그인</button>
                            <span class="text-gray-300">|</span>
                            <button onclick="openModal('signupModal')" class="hover:text-blue-700 transition">회원가입</button>
                        </div>
                    </div>

                    <!-- 메인 타이틀 -->
                    <div class="text-center text-white mt-4 mb-6">
                        <h1 class="text-4xl sm:text-6xl font-black tracking-tight mb-4 drop-shadow-md">진행중인 채용</h1>
                        <p class="text-xl sm:text-2xl font-medium tracking-tight text-white/95 drop-shadow">마을과 사람을 잇는 길, 당신과 함께 만들어가겠습니다.</p>
                    </div>

                    <!-- 더보기 버튼 -->
                    <div class="flex justify-end mb-6">
                        <button onclick="switchTab('jobs')" class="bg-[#2a4ec2] hover:bg-blue-800 text-white font-bold px-6 py-2 rounded-none text-base shadow-md transition flex items-center space-x-2">
                            <span>더보기</span>
                            <span>&gt;</span>
                        </button>
                    </div>

                    <!-- 동적 채용공고 카드 그리드 (Supabase 데이터 불러오기) -->
                    <div id="home-jobs-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
                        <div class="col-span-4 text-center text-white text-lg py-12">채용 공고를 불러오는 중입니다...</div>
                    </div>

                </div>
            </section>
        </div>

        <!-- 2. 채용공고 전체보기 탭 -->
        <div id="view-jobs" class="view-section hidden max-w-7xl mx-auto px-4 py-12">
            <h2 class="text-3xl font-extrabold text-gray-900 mb-6">채용공고 전체보기</h2>
            <div id="full-jobs-list" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- JS 생성 -->
            </div>
        </div>

        <!-- 3. 나의채용 (합격확인) 탭 -->
        <div id="view-my" class="view-section hidden max-w-3xl mx-auto px-4 py-12">
            <div class="bg-white p-8 border border-gray-200 shadow-md">
                <h2 class="text-2xl font-bold text-gray-900 mb-4 text-center">나의 채용 / 합격확인</h2>
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-1">성명</label>
                        <input type="text" id="check-name" class="w-full border p-3 rounded" placeholder="성명을 입력하세요">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-1">연락처</label>
                        <input type="text" id="check-phone" class="w-full border p-3 rounded" placeholder="010-0000-0000">
                    </div>
                    <button onclick="checkPassStatus()" class="w-full bg-blue-700 text-white font-bold py-3 hover:bg-blue-800">조회하기</button>
                </div>
                <div id="pass-result" class="mt-6"></div>
            </div>
        </div>

        <!-- 4. 공지사항 탭 -->
        <div id="view-notice" class="view-section hidden max-w-5xl mx-auto px-4 py-12">
            <h2 class="text-3xl font-extrabold text-gray-900 mb-6">공지사항</h2>
            <div class="bg-white border border-gray-200 shadow-sm">
                <table class="w-full text-left">
                    <thead class="bg-gray-100 border-b">
                        <tr>
                            <th class="p-4 text-center w-20">번호</th>
                            <th class="p-4">제목</th>
                            <th class="p-4 text-center w-32">작성일</th>
                        </tr>
                    </thead>
                    <tbody id="notice-list-body">
                        <!-- JS 생성 -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- 5. 채용문의 Q&A 탭 -->
        <div id="view-inquiry" class="view-section hidden max-w-4xl mx-auto px-4 py-12">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-3xl font-extrabold text-gray-900">채용문의 Q&A</h2>
                <button onclick="openModal('inquiryModal')" class="bg-blue-700 text-white px-5 py-2 font-bold shadow hover:bg-blue-800">문의하기</button>
            </div>
            <div id="inquiry-list" class="space-y-4">
                <!-- JS 생성 -->
            </div>
        </div>

    </main>

    <!-- 푸터 -->
    <footer class="bg-gray-900 text-gray-400 py-8 px-4 text-center text-sm border-t border-gray-800">
        <p class="mb-2"><strong>삼산여객주 주식회사</strong> | 채용 문의전화: 02-555-8282</p>
        <p class="text-xs text-gray-500">&copy; 2026 SAMSAN PASSENGER CORP. ALL RIGHTS RESERVED.</p>
    </footer>

    <!-- 모달: 로그인 -->
    <div id="loginModal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white p-8 max-w-sm w-full relative">
            <button onclick="closeModal('loginModal')" class="absolute top-4 right-4 text-gray-400"><i class="fas fa-times"></i></button>
            <h3 class="text-2xl font-bold mb-4 text-gray-900">로그인</h3>
            <input type="email" id="login-email" placeholder="이메일 주소" class="w-full border p-3 mb-3 rounded">
            <input type="password" id="login-password" placeholder="비밀번호" class="w-full border p-3 mb-4 rounded">
            <button onclick="handleLogin()" class="w-full bg-blue-700 text-white font-bold py-3 hover:bg-blue-800 rounded">로그인</button>
        </div>
    </div>

    <!-- 모달: 회원가입 -->
    <div id="signupModal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white p-8 max-w-sm w-full relative">
            <button onclick="closeModal('signupModal')" class="absolute top-4 right-4 text-gray-400"><i class="fas fa-times"></i></button>
            <h3 class="text-2xl font-bold mb-4 text-gray-900">회원가입</h3>
            <input type="email" id="signup-email" placeholder="이메일 주소" class="w-full border p-3 mb-3 rounded">
            <input type="password" id="signup-password" placeholder="비밀번호" class="w-full border p-3 mb-4 rounded">
            <button onclick="handleSignup()" class="w-full bg-blue-700 text-white font-bold py-3 hover:bg-blue-800 rounded">가입하기</button>
        </div>
    </div>

    <!-- 모달: 입사지원서 작성 -->
    <div id="applyModal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white p-8 max-w-xl w-full relative max-h-[90vh] overflow-y-auto">
            <button onclick="closeModal('applyModal')" class="absolute top-4 right-4 text-gray-400"><i class="fas fa-times"></i></button>
            <h3 id="apply-title" class="text-2xl font-bold mb-4 text-blue-900">입사지원서 작성</h3>
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-bold mb-1 text-gray-700">지원자 성명</label>
                    <input type="text" id="app-name" class="w-full border p-2.5 rounded" placeholder="홍길동">
                </div>
                <div>
                    <label class="block text-xs font-bold mb-1 text-gray-700">연락처</label>
                    <input type="text" id="app-phone" class="w-full border p-2.5 rounded" placeholder="010-0000-0000">
                </div>
                <div>
                    <label class="block text-xs font-bold mb-1 text-gray-700">자기소개 및 지원동기</label>
                    <textarea id="app-letter" rows="4" class="w-full border p-2.5 rounded" placeholder="내용을 작성해주세요."></textarea>
                </div>
                <button onclick="submitApplication()" class="w-full bg-blue-700 text-white font-bold py-3 hover:bg-blue-800 rounded">제출하기</button>
            </div>
        </div>
    </div>

    <!-- 모달: 문의 등록 -->
    <div id="inquiryModal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white p-8 max-w-lg w-full relative">
            <button onclick="closeModal('inquiryModal')" class="absolute top-4 right-4 text-gray-400"><i class="fas fa-times"></i></button>
            <h3 class="text-2xl font-bold mb-4 text-gray-900">채용문의 작성</h3>
            <input type="text" id="inq-title" placeholder="문의 제목" class="w-full border p-3 mb-3 rounded">
            <textarea id="inq-content" rows="4" placeholder="문의 내용을 입력하세요" class="w-full border p-3 mb-4 rounded"></textarea>
            <button onclick="submitInquiry()" class="w-full bg-blue-700 text-white font-bold py-3 hover:bg-blue-800 rounded">문의 등록</button>
        </div>
    </div>

    <!-- Supabase 연동 JS Script -->
    <script>
        // Supabase 설정 (본인 정보 입력)
        const SUPABASE_URL = 'https://ufxyjmrdevqjcmnzbiug.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_151wbWxnhngrFIpjQp3m4Q_K_JMQ9Jd';

        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        let selectedJobTitle = '';

        // 1. 초기 데이터 불러오기
        async function initData() {
            await loadJobs();
            await loadNotices();
            await loadInquiries();
            checkUserSession();
        }

        // 채용 공고 불러오기 (홈 화면 & 전체보기)
        async function loadJobs() {
            const { data: jobs, error } = await supabaseClient
                .from('jobs')
                .select('*')
                .order('created_at', { ascending: true });

            if (error) {
                console.error('채용공고 불러오기 실패:', error);
                return;
            }

            const homeGrid = document.getElementById('home-jobs-grid');
            const fullList = document.getElementById('full-jobs-list');

            if (!jobs || jobs.length === 0) {
                homeGrid.innerHTML = `<div class="col-span-4 text-center text-white py-8">등록된 채용 공고가 없습니다.</div>`;
                fullList.innerHTML = `<p class="text-gray-500">등록된 채용 공고가 없습니다.</p>`;
                return;
            }

            // 메인 홈 화면 카드 렌더링
            homeGrid.innerHTML = '';
            jobs.forEach((job) => {
                const card = document.createElement('div');
                card.className = "exact-job-card cursor-pointer";
                card.onclick = () => openApplyModal(job.title);
                card.innerHTML = `
                    <div>
                        <span class="${job.category_color || 'text-orange-600'} font-extrabold text-xl tracking-tight block mb-2">${job.category}</span>
                        <h3 class="text-xl font-bold text-gray-900 leading-snug tracking-tight">${job.title}</h3>
                    </div>
                    <div class="text-xs font-semibold text-gray-400">
                        ${job.headcount}
                    </div>
                `;
                homeGrid.appendChild(card);
            });

            // 전체보기 탭 렌더링
            fullList.innerHTML = '';
            jobs.forEach((job) => {
                const card = document.createElement('div');
                card.className = "bg-white p-6 border shadow-sm flex flex-col justify-between";
                card.innerHTML = `
                    <div>
                        <span class="${job.category_color || 'text-orange-600'} font-bold text-sm block mb-1">${job.category}</span>
                        <h3 class="text-2xl font-bold text-gray-900 mb-2">${job.title}</h3>
                        <p class="text-gray-600 text-sm mb-4">${job.headcount}</p>
                    </div>
                    <button onclick="openApplyModal('${job.title}')" class="bg-blue-700 text-white font-bold py-2 px-4 w-full hover:bg-blue-800">입사지원하기</button>
                `;
                fullList.appendChild(card);
            });
        }

        // 공지사항 불러오기
        async function loadNotices() {
            const { data: notices, error } = await supabaseClient.from('notices').select('*').order('created_at', { ascending: false });
            const body = document.getElementById('notice-list-body');

            if (!notices || notices.length === 0) {
                body.innerHTML = `<tr><td colspan="3" class="p-4 text-center text-gray-500">등록된 공지사항이 없습니다.</td></tr>`;
                return;
            }

            body.innerHTML = '';
            notices.forEach((item, index) => {
                const date = new Date(item.created_at).toLocaleDateString();
                body.innerHTML += `
                    <tr class="border-b hover:bg-gray-50">
                        <td class="p-4 text-center font-bold">${index + 1}</td>
                        <td class="p-4 font-bold text-gray-800">${item.title}</td>
                        <td class="p-4 text-center text-gray-500 text-sm">${date}</td>
                    </tr>
                `;
            });
        }

        // 채용문의 불러오기
        async function loadInquiries() {
            const { data: list, error } = await supabaseClient.from('inquiries').select('*').order('created_at', { ascending: false });
            const container = document.getElementById('inquiry-list');

            if (!list || list.length === 0) {
                container.innerHTML = `<div class="bg-white p-6 border text-gray-500 text-center">등록된 문의사항이 없습니다.</div>`;
                return;
            }

            container.innerHTML = '';
            list.forEach((item) => {
                container.innerHTML += `
                    <div class="bg-white p-6 border border-gray-200 shadow-sm">
                        <h3 class="font-bold text-lg mb-2 text-gray-900">Q. ${item.title}</h3>
                        <p class="text-gray-600 text-sm">${item.content}</p>
                    </div>
                `;
            });
        }

        // 2. 입사지원 제출 (Supabase DB 저장)
        async function submitApplication() {
            const name = document.getElementById('app-name').value;
            const phone = document.getElementById('app-phone').value;
            const letter = document.getElementById('app-letter').value;

            if (!name || !phone) {
                alert('이름과 연락처를 작성해 주세요.');
                return;
            }

            const { error } = await supabaseClient.from('applications').insert([
                { job_title: selectedJobTitle, applicant_name: name, phone: phone, cover_letter: letter }
            ]);

            if (error) {
                alert('지원서 접수에 실패했습니다.');
                console.error(error);
            } else {
                alert('지원서가 성공적으로 접수되었습니다!');
                closeModal('applyModal');
                document.getElementById('app-name').value = '';
                document.getElementById('app-phone').value = '';
                document.getElementById('app-letter').value = '';
            }
        }

        // 3. 합격 / 지원 상태 조회
        async function checkPassStatus() {
            const name = document.getElementById('check-name').value;
            const phone = document.getElementById('check-phone').value;
            const res = document.getElementById('pass-result');

            if (!name || !phone) {
                alert('성명과 연락처를 모두 입력해 주세요.');
                return;
            }

            const { data, error } = await supabaseClient
                .from('applications')
                .select('*')
                .eq('applicant_name', name)
                .eq('phone', phone);

            if (error || !data || data.length === 0) {
                res.innerHTML = `
                    <div class="bg-red-50 border border-red-200 p-4 text-center rounded">
                        <p class="font-bold text-red-900">일치하는 입사지원 내역이 없습니다.</p>
                    </div>
                `;
                return;
            }

            res.innerHTML = '';
            data.forEach((app) => {
                res.innerHTML += `
                    <div class="bg-blue-50 border border-blue-200 p-4 text-center rounded mb-3">
                        <p class="font-bold text-blue-900 text-lg">${app.applicant_name} 지원자님 (${app.job_title})</p>
                        <p class="text-sm text-gray-700 mt-1">현재 상태: <strong class="text-blue-700">${app.status}</strong></p>
                    </div>
                `;
            });
        }

        // 4. 채용문의 등록
        async function submitInquiry() {
            const title = document.getElementById('inq-title').value;
            const content = document.getElementById('inq-content').value;

            if (!title || !content) {
                alert('제목과 내용을 입력해주세요.');
                return;
            }

            const { error } = await supabaseClient.from('inquiries').insert([{ title, content }]);

            if (error) {
                alert('문의 등록 실패');
            } else {
                alert('문의가 등록되었습니다.');
                closeModal('inquiryModal');
                loadInquiries();
            }
        }

        // 5. 회원가입 및 로그인 처리
        async function handleSignup() {
            const email = document.getElementById('signup-email').value;
            const password = document.getElementById('signup-password').value;

            const { data, error } = await supabaseClient.auth.signUp({ email, password });
            if (error) alert('회원가입 실패: ' + error.message);
            else {
                alert('회원가입 완료!');
                closeModal('signupModal');
            }
        }

        async function handleLogin() {
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;

            const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
            if (error) alert('로그인 실패: ' + error.message);
            else {
                alert('로그인 성공!');
                closeModal('loginModal');
                checkUserSession();
            }
        }

        async function checkUserSession() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            const container = document.getElementById('auth-status-container');
            if (session) {
                container.innerHTML = `
                    <span class="text-blue-900">${session.user.email}</span>
                    <span class="text-gray-300">|</span>
                    <button onclick="handleLogout()" class="hover:text-blue-700">로그아웃</button>
                `;
            }
        }

        async function handleLogout() {
            await supabaseClient.auth.signOut();
            location.reload();
        }

        // UI 탭 제어
        function switchTab(tabId) {
            document.querySelectorAll('.view-section').forEach(el => el.classList.add('hidden'));
            const target = document.getElementById(`view-${tabId}`);
            if (target) target.classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function toggleMobileNav() {
            document.getElementById('mobile-nav').classList.toggle('hidden');
        }

        function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

        function openApplyModal(jobTitle) {
            selectedJobTitle = jobTitle;
            document.getElementById('apply-title').innerText = `${jobTitle} 입사지원`;
            openModal('applyModal');
        }

        window.addEventListener('DOMContentLoaded', initData);
    </script>
</body>
</html>
